<head th:fragment="head (pageTitle)">
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Freak-E Shop - Tu Mundo Geek En Un Solo Lugar" />
    <title th:text="${pageTitle}">Freak-E Shop</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet" />

    <!-- Bootstrap 5.3 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />

    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />

    <!-- Custom Styles -->
    <link th:href="@{/css/styles.css}" href="../static/css/styles.css" rel="stylesheet" />
    <!-- Theme Preload to prevent flashing -->
    <script>
        if (localStorage.getItem('stride-theme') === 'light') {
            const observer = new MutationObserver(function(mutations, obs) {
                if (document.body) {
                    document.body.classList.add('light-theme');
                    obs.disconnect();
                }
            });
            observer.observe(document.documentElement, { childList: true });
        }
    </script>
</head>
