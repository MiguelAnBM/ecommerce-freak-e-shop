<!-- ── Pie de página ────────────────────────────────── -->
<footer th:fragment="footer" class="stride-footer">
    <div class="container">
        <div class="row g-4">
            <!-- Columna de marca -->
            <div class="col-lg-3 col-md-6">
                <div class="footer-brand">
                    <a class="navbar-brand" th:href="@{/}">
                        <img th:src="@{/images/logo.png}" alt="Freak-E Shop" class="logo-img" />

                    </a>
                </div>
                <p class="footer-desc">Descubre figuras, accesorios y piezas únicas inspiradas en tus universos favoritos,
                        creadas para brillar en cada detalle.</p>
                <div class="social-icons">
                    <a href="#" aria-label="Instagram"><i class="bi bi-instagram"></i></a>
                    <a href="#" aria-label="Facebook"><i class="bi bi-facebook"></i></a>
                    <a href="#" aria-label="Twitter"><i class="bi bi-twitter-x"></i></a>
                    <a href="#" aria-label="YouTube"><i class="bi bi-youtube"></i></a>
                    <a href="#" aria-label="TikTok"><i class="bi bi-tiktok"></i></a>
                </div>
            </div>

            <!-- Enlaces de tienda -->
            <div class="col-lg-3 col-md-6">
                <h5 class="footer-heading">Tienda</h5>
                <ul class="footer-links">
                    <li><a th:href="@{/catalogo(categoria='Accesorio')}">Accesorios</a></li>
                    <li><a th:href="@{/catalogo(categoria='Mochila')}">Mochilas</a></li>
                    <li><a th:href="@{/catalogo(categoria='Comic')}">Cómics</a></li>
                    <li><a th:href="@{/catalogo(categoria='Camisa')}">Camisas</a></li>
                    <li><a th:href="@{/catalogo(categoria='FiguraColeccionable')}">Figuras Coleccionables</a></li>
                    <li><a th:href="@{/catalogo(categoria='Peluche')}">Peluches</a></li>
                </ul>
            </div>

        <!-- Parte inferior del pie de página -->
        <div class="footer-bottom">
            <div class="row align-items-center">
                
                <div class="col-md-7">
                    <div class="footer-bottom-links">
                        <a th:href="@{/privacy}">Privacy</a>
                        <a th:href="@{/terms}">Terms</a>
                        <div class="payment-icons">
                            <span class="payment-icon">VISA</span>
                            <span class="payment-icon" style="background:#eb001b;border-color:#eb001b;">
                                <i class="bi bi-circle-fill" style="font-size:0.5rem;color:#fff;"></i>
                            </span>
                            <span class="payment-icon" style="background:#006fcf;border-color:#006fcf;">AMEX</span>
                            <span class="payment-icon">Pay</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</footer>
