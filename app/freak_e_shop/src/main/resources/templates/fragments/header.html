<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<!-- ============================================
     STRIDE — Navbar Fragment
     Compatible with Spring Boot + Thymeleaf
     ============================================ -->

<head>
    <meta charset="UTF-8" />
</head>

<body>

    <!-- ========== NAVBAR ========== -->
    <nav th:fragment="navbar" class="navbar navbar-expand-lg stride-navbar">
        <div class="container">
            <!-- Logo -->
            <a class="navbar-brand" th:href="@{/}">
                <img th:src="@{/images/logo.png}" alt="Freak-E Shop" class="logo-img" />
            </a>

            <!-- Mobile toggler -->
            <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse" data-bs-target="#navbarMain"
                aria-controls="navbarMain" aria-expanded="false" aria-label="Toggle navigation">
                <i class="bi bi-list text-white fs-4"></i>
            </button>

            <!-- ========================================
             NAV LINKS
             Para modificar: añade/elimina <li> elements
             Para cambiar URL: modifica th:href="@{/ruta}"
             Para cambiar texto: modifica el texto dentro del <a>
             ======================================== -->
            <div class="collapse navbar-collapse justify-content-center" id="navbarMain">
                <ul class="navbar-nav gap-1">
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/}" href="index.html"
                            th:classappend="${activePage == 'home'} ? 'active'">Home</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/catalog}" href="catalog.html"
                            th:classappend="${activePage == 'catalog'} ? 'active'">Catalogue</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/#categories}">Categorías</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/#cta}">Sobre nosotros</a>
                    </li>
                </ul>
            </div>

            <!-- ========================================
             ICON BUTTONS (derecha)
             Orden: Búsqueda | Tema | Wishlist | Login
             Para añadir un ícono: copia un <button> y cambia la clase bi-*
             Iconos disponibles: https://icons.getbootstrap.com/
             ======================================== -->
            <div class="navbar-icons d-none d-lg-flex">
                <!-- 🔍 Búsqueda -->
                <button class="icon-btn" id="searchBtn" aria-label="Search">
                    <i class="bi bi-search"></i>
                </button>
                <!-- 🎨 Cambio de color de fondo (tema claro/oscuro) -->
                <button class="icon-btn" id="themeToggle" aria-label="Toggle theme" onclick="toggleTheme()">
                    <i class="bi bi-sun" id="themeIcon"></i>
                </button>
                <!-- 🛒 Carrito de compras -->
                <a th:href="@{/cart}" href="cart.html" class="icon-btn" id="cartBtn" aria-label="Shopping cart">
                    <i class="bi bi-bag"></i>
                    <span class="cart-badge" th:text="${cartCount != null} ? ${cartCount} : '2'">2</span>
                </a>
                <!-- 👤 Login / Usuario -->
                <a th:href="@{/login}" class="icon-btn" id="userLoginBtn" aria-label="User login">
                    <i class="bi bi-person-circle"></i>
                </a>
            </div>
        </div>
    </nav>

</body>

</html>
