<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Freak-E Shop - Carrito')}"></head>
<body>

<!-- ========== NAVBAR ========== -->
<div th:replace="~{fragments/header :: navbar}"></div>


<!-- ============================================================
     SHOPPING CART
     ============================================================ -->
<section class="cart-section">
    <div class="container">

        <!-- Breadcrumb -->
        <div class="breadcrumb-custom">
            <a th:href="@{/}" href="index.html">Inicio</a> / <span>Carrito de Compras</span>
        </div>

        <h1 class="cart-title">Carrito de Compras</h1>

        <div class="row g-4">
            <!-- LEFT: Cart Items -->
            <div class="col-lg-8">

                <!-- Table Header (desktop) -->
                <div class="cart-table-header d-none d-md-grid">
                    <div>Producto</div>
                    <div>Precio</div>
                    <div>Cantidad</div>
                    <div>Total</div>
                    <div></div>
                </div>

                <!-- ============================
                     🛒 CART ITEMS (Dynamic Rendering)
                     ============================ -->
                <div id="cartItemsList">
                    <!-- Items will be injected by main.js -->
                </div>

                <!-- Cart Actions -->
                <div class="cart-actions">
                    <a th:href="@{/}" href="index.html" class="continue-link">
                        <i class="bi bi-arrow-left"></i> Continuar comprando
                    </a>
                    <button class="clear-cart-btn" onclick="clearCart()">Clear Cart</button>
                </div>
            </div>

            <!-- RIGHT: Order Summary -->
            <div class="col-lg-4">
                <div class="order-summary">
                    <h3 class="order-summary-title">Resumen del pedido</h3>

                    <!-- Promo Code -->
                    <p class="promo-label">Código de promoción</p>
                    <div class="promo-input-group">
                        <input type="text" class="promo-input" placeholder="Ingrese el código" id="promoInput"/>
                        <button class="promo-btn" onclick="applyPromo()">Aplicar</button>
                    </div>
                    <p class="promo-hint">Try: STRIDE20 for 20% off</p>

                    <hr class="summary-divider"/>

                    <!-- Summary Lines -->
                    <div class="summary-row">
                        <span class="label">Subtotal</span>
                        <span class="value" id="summarySubtotal">$437</span>
                    </div>  
                    <div class="summary-row">
                        <span class="label">Envio</span>
                        <span class="value free" id="summaryShipping">GRATIS</span>
                    </div>
                    <p class="free-shipping-msg" id="freeShippingMsg">
                        <i class="bi bi-check-circle-fill"></i> Usted califica para el envío gratis!
                    </p>
                    <div class="summary-row">
                        <span class="label">Impuesto Estimado</span>
                        <span class="value" id="summaryTax">$35</span>
                    </div>

                    <!-- Total -->
                    <div class="summary-total">
                        <span>Total</span>
                        <span id="summaryTotal">$472</span>
                    </div>

                    <!-- Checkout Button -->
                    <button class="checkout-btn" onclick="proceedToCheckout()">
                        Proceder a Pagar
                    </button>
                </div>
            </div>
        </div>

    </div>
</section>


<!-- ========== JOIN CLUB BAR ========== -->
<div th:replace="~{fragments/footer :: joinclub}"></div>


<!-- ========== FOOTER ========== -->
<div th:replace="~{fragments/footer :: footer}"></div>


<!-- Scripts -->
<div th:replace="~{fragments/scripts :: scripts}"></div>

</body>
</html>
